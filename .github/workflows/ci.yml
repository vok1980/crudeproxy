name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit:
    name: Unit (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: [ '1.22', '1.23' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt reports unformatted files:"
            gofmt -l .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Unit tests with race detector
        run: go test -race -count=1 -v ./...

      - name: Build
        run: CGO_ENABLED=0 go build -o crudeproxy .

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    needs: unit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y openssl curl

      - name: Run end-to-end tests
        run: ./test.sh
